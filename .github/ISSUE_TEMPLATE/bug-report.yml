name: "Bug report / 不具合の報告"
description: Report a problem with Retro Pachislot Emulator.
body:
- type: markdown
  attributes:
    value: |
      Never attach ROM files. / ROM ファイルは添付しないでください。

- type: input
  attributes:
    label: Version and OS / バージョンと OS
    placeholder: "retropachislotemu -version の出力, Windows 11"
  validations:
    required: true

- type: textarea
  attributes:
    label: What happened and how to reproduce / 起きたことと再現手順
  validations:
    required: true
