<svg xmlns="http://www.w3.org/2000/svg" width="148" height="66" viewBox="0 0 148 66" preserveAspectRatio="none">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#353d47"/>
      <stop offset="0.15" stop-color="#aebcca"/>
      <stop offset="0.4"  stop-color="#eef3f8"/>
      <stop offset="0.6"  stop-color="#8f9cab"/>
      <stop offset="0.82" stop-color="#e2eaf2"/>
      <stop offset="1"    stop-color="#4d5864"/>
    </linearGradient>
    <radialGradient id="mouth" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0"   stop-color="#05070a"/>
      <stop offset="0.7" stop-color="#1c2128"/>
      <stop offset="1"   stop-color="#343c46"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0.3" x2="1" y2="0">
      <stop offset="0"    stop-color="#7d8896"/>
      <stop offset="0.3"  stop-color="#dfe8f1"/>
      <stop offset="0.55" stop-color="#b3c1d4"/>
      <stop offset="0.75" stop-color="#f4f8fb"/>
      <stop offset="1"    stop-color="#8894a2"/>
    </linearGradient>
  </defs>

  <!-- contact shadow on the ledge -->
  <ellipse cx="74" cy="64.8" rx="72" ry="2.2" fill="#000" opacity="0.3"/>

  <!-- chrome hood: steep-sided dome standing on the ledge -->
  <path d="M 4,65 C 4,20 30,2 74,2 C 118,2 144,20 144,65 Z" fill="url(#rim)" stroke="#262c33" stroke-width="1"/>

  <!-- dark medal mouth (thin chrome rim left around it) -->
  <path d="M 8.5,65 C 8.5,23 33,6.5 74,6.5 C 115,6.5 139.5,23 139.5,65 Z" fill="url(#mouth)"/>

  <!-- chrome tongue: a smile-shaped band, low on the left, rising to meet the right rim;
       the dark chute stays visible below it -->
  <path d="M 11,37 C 31,51 86,51 135.5,28
           C 94,72 31,74 11,37 Z"
        fill="url(#lip)" stroke="#2a3038" stroke-width="0.7"/>

  <!-- specular glints -->
  <path d="M 22,24 C 34,11 52,6 74,5.5" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
  <path d="M 36,53 C 62,58 98,52 126,38" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
</svg>
