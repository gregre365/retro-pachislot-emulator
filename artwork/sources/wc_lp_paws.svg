<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="780 320 400 190" preserveAspectRatio="none">
  <!-- license:CC0  copyright-holders:gregre365 -->
  <!-- The black cat's front paws resting on the can's lid, toes hooked over
       its front edge.  Same cel-shaded style as the cat: dark base, flat grey
       light planes, dark red-brown outline.  Coordinates are
       wc_lp_panel.png pixels (the right paw is the left one mirrored about x=973). -->
  <defs>
    <g id="paw">
      <!-- foreleg: only a short stretch shows between the chest and the paw,
           in the body's own dark grey so its top edge is not visible -->
      <path d="M 892,342 L 962,342 L 944,392 L 836,392 Z" fill="#202124"/>
      <path d="M 892,342 L 836,392 M 962,342 L 944,392" fill="none" stroke="#2a0e02" stroke-width="3" stroke-linecap="round"/>
      <path d="M 888,350 L 878,350 L 842,384 L 853,386 Z" fill="#606169"/>
      <!-- paw: knuckles on top of the lid, four toes over its front edge -->
      <path d="M 812,400 C 812,372 846,356 885,356 C 924,356 958,372 958,400 L 958,440
               C 958,456 952,464 942,464 C 934,464 929,459 926,455
               C 922,463 914,468 905,468 C 896,468 889,462 886,457
               C 882,463 875,468 866,468 C 856,468 850,462 846,455
               C 842,462 835,466 826,466 C 816,466 812,456 812,444 Z"
            fill="#232427" stroke="#2a0e02" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 834,380 C 850,367 872,362 900,363 L 882,374 L 846,386 Z" fill="#606169"/>
      <!-- toe creases -->
      <path d="M 846,455 L 850,432 M 886,457 L 886,430 M 926,455 L 922,432"
            fill="none" stroke="#0c0d0f" stroke-width="3" stroke-linecap="round"/>
      <!-- claws gripping the can -->
      <g fill="#e9e5d9" stroke="#2a0e02" stroke-width="1.4" stroke-linejoin="round">
        <path d="M 822,464 Q 826,477 830,464 Z"/>
        <path d="M 862,466 Q 866,479 870,466 Z"/>
        <path d="M 901,466 Q 905,479 909,466 Z"/>
        <path d="M 938,462 Q 942,475 946,462 Z"/>
      </g>
    </g>
  </defs>
  <use href="#paw"/>
  <use href="#paw" transform="translate(1946,0) scale(-1,1)"/>
</svg>
